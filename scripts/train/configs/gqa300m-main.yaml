# 340M 主实验训练配置（GQA baseline，与 lsr300m-main.yaml 仅 model_name/exp_name 不同）。
# 用法：python scripts/pretrain.py --config scripts/train/configs/gqa300m-main.yaml

# ---- 模型与实验 ----
model_name: gdn2_gqa_340M          # Config.from_name（model/lit_gpt/config.py）
exp_name: 20260905-1148-lsr300m-16B/gdn2_gqa_340M

# ---- 数据 ----
train_data_dir: /work/projects/memos-b3/datasets/lzc_rnn/fineweb-litdata/100BT/train
out_root: outputs

# ---- 资源与并行 ----
devices: 8
nodes: 1
strategy: ddp                      # 显存够用 ddp 最快；OOM 再升 fsdp_zero2/fsdp
recompute_n: 0                     # 激活重算粒度（0=关闭；显存不足时 12 为显存中性档）

# ---- 训练量与 batch ----
max_tokens: 15,728,640,000         # 30000 steps（逗号分隔数字可正确解析）
global_batch_size: 128             # 128×4096 = 0.5M tok/step
micro_batch_size: 4                # grad_accum = 128/(4×8卡) = 4

# ---- 优化器（对齐 GDN/GDN2 原版）----
learning_rate: 4.0e-4
min_lr_ratio: 0.1                  # cosine 退火到 LR/10
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
warmup_tokens: null                # null → max_tokens 的 1%

# ---- 日志 / ckpt ----
log_iter_interval: 5
save_step_interval: 1000
save_total_limit: 3                # 周期 ckpt 只留最新 3 个（final 不计入）
wandb: false
swanlab: true                      # SwanLab 监控（offline 落盘，事后登录节点 sync）
swanlab_project: rnn-lsr
swanlab_mode: offline
seed: 3407
num_workers: 4
