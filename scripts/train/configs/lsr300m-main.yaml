# 340M 主实验训练配置（20260831-2009-lsa300m-main 的复现口径）。
# 用法：python scripts/pretrain.py --config scripts/train/configs/lsr300m-main.yaml
# 优先级：命令行显式参数 > 本文件 > 代码内置默认（如冒烟可 --max_tokens 100000000 覆盖）。
# 注意：exp_name 为历史记录值，新实验务必修改（决定输出目录 <out_root>/<exp_name>）。

# ---- 模型与实验 ----
model_name: gdn2_lsr_340M          # Config.from_name（model/lit_gpt/config.py）
exp_name: 20260831-2009-lsa300m-main/gdn2_lsr_340M

# ---- 数据 ----
train_data_dir: /work/projects/memos-b3/datasets/lzc_rnn/fineweb-litdata/100BT/train
out_root: outputs

# ---- 资源与并行 ----
devices: 8
nodes: 1
strategy: ddp                      # 显存够用 ddp 最快；OOM 再升 fsdp_zero2/fsdp

# ---- 训练量与 batch ----
max_tokens: 16106127360            # 15×1024^3 ≈ 16.1B tokens；gbs 128 时 ≈ 30720 steps
global_batch_size: 128             # 128×4096 = 0.5M tok/step
micro_batch_size: 4                # grad_accum = 128/(4×8卡) = 4

# ---- 优化器（对齐 GDN/GDN2 原版）----
learning_rate: 4.0e-4
min_lr_ratio: 0.1                  # cosine 退火到 LR/10
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
warmup_tokens: null                # null → max_tokens 的 1%

# ---- 日志 / ckpt ----
log_iter_interval: 5
save_step_interval: 500
wandb: false
seed: 3407
num_workers: 4
