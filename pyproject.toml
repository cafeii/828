[project]
name = "rnn"
version = "0.1.0"
description = "RNN 前沿架构探索（基于 GDN/KDA/GDN2 的结构改进）"
requires-python = ">=3.10,<3.13"
# 依赖范围对齐 third_party/GatedDeltaNet-2/requirements.txt（minimal）+ 数据处理件。
# 以下为纯 PyPI 依赖；手动件（不进锁文件，见 scripts/setup/）：
#   flash-attn==2.8.3   —— 需 --no-build-isolation 或预编译 wheel（Linux/CUDA）
#   fla                 —— editable 安装自 third_party/flash-linear-attention
dependencies = [
    "torch==2.9.0",
    "numpy",
    "einops",
    "transformers",
    "datasets==2.20.0",
    "lightning==2.1.2",
    "litdata",
    "pyarrow",
    "pandas",
    "zstandard",
    "wandb",
    "sentencepiece",
    "tokenizers",
    "typing_extensions",
    "ninja",
    "packaging",
    "setuptools<81",  # lightning 2.1.2 依赖 pkg_resources（81+ 已移除）
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
